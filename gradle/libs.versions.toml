[versions]
agp = "9.4.1"
junit = "4.13.2"
appcompat = "1.6.1"          # 1.7.0+ needs 21
recyclerview = "1.3.2"       # 1.4.0+ needs 21
constraintlayout = "2.1.4"
material = "1.9.0"           # if sync complains, drop to 1.6.1
gson = "2.8.9"               # 2.10+ uses ReflectiveOperationException (API 19) -> VerifyError on 17
glide = "4.16.0"             # image loading, minSdk 14
okhttp = "3.12.13"           # last line supporting API < 21
multidex = "2.0.1"           # API < 21 needs it once the app passes 64K methods

[libraries]
junit            = { group = "junit", name = "junit", version.ref = "junit" }
appcompat        = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
recyclerview     = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
material         = { group = "com.google.android.material", name = "material", version.ref = "material" }
gson             = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
glide            = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
okhttp           = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
multidex         = { group = "androidx.multidex", name = "multidex", version.ref = "multidex" }
mockwebserver    = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }